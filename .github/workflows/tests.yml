name: tests

# Corre la batería de tests unitarios (pytest) en cada push y pull request.
# Se usa ubuntu-22.04 porque Python 3.7 (la versión del proyecto) ya no está
# disponible en ubuntu-latest. Solo se instalan las dependencias que los tests
# importan de verdad: numpy y pytest. La app completa (ttkbootstrap, matplotlib,
# psycopg2, ...) no hace falta porque los módulos bajo prueba las importan de
# forma diferida dentro de las funciones.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt numpy

      - name: Correr la suite
        run: python -m pytest -m "not gui and not db"
