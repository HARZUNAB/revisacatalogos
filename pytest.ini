[pytest]
testpaths = tests
addopts = -v
markers =
    gui: necesita pantalla (DISPLAY); se salta si no hay display.
    db: necesita conexión a PostgreSQL o un mock de psycopg2.
    red: usa la red (siempre con mock); no se excluye de la corrida por defecto.
    lento: tarda más de lo habitual (catálogos grandes, etc.).
